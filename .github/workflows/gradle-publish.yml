name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # gradlew 권한 설정
      - name: Set gradlew permissions
        run: chmod +x ./gradlew
        working-directory: ./finalProject_3

      # Gradle 빌드
      - name: Build with Gradle
        run: ./gradlew clean build
        working-directory: ./finalProject_3

      # SSH 키 설정
      - name: Set SSH key permissions
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # SSH 에이전트 등록
      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      # known_hosts 등록
      - name: Add known_hosts
        run: |
          ssh-keyscan -H ed25519 3.104.54.24 >> ~/.ssh/known_hosts

      # EC2에 배포 디렉터리 생성
      - name: Create remote directory
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@3.104.54.24 "mkdir -p ~/app"

      # JAR 파일 EC2로 전송
      - name: Deploy to Server with rsync
        run: |
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
          finalProject_3/build/libs/jenkins-0.0.1-SNAPSHOT.jar \
          ubuntu@3.104.54.24:~/app/

      # EC2에서 기존 애플리케이션 종료 및 재실행
      - name: Run SSH commands
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@3.104.54.24 << 'EOF'
            pkill -f 'java -jar' || true
            nohup java -jar ~/app/jenkins-0.0.1-SNAPSHOT.jar > ~/app/log.txt 2>&1 &
          EOF
```
